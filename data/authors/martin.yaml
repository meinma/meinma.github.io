bio: |
  I am a postdoctoral researcher in the [Casale lab](https://aih-sgml.github.io/casalelab/) developing methods for transcriptomics and single-cell genetics data for biomarker and drug target discovery.
  
  During my PhD, I identified a sparse gene signature distinguishing a rare skin lymphoma from the two most common inflammatory skin diseases, resulting in a filed patent and the research-use-only diagnostic tool [Erysk](https://dermagnostix.com/de/erysk-targetdisk/) (in collaboration with Dermagnostix).
  
  As a Chan Zuckerberg resident, I worked on causal inference with single-cell genetics data to identify candidate causal disease genes and the cell states in which they act, enabling more precise therapeutic intervention.

  My goal is to create translational impact.

